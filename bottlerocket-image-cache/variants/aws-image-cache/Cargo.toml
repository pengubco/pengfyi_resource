[package]
name = "aws-image-cache"
version = "0.1.0"
edition = "2021"
publish = false
build = "../build.rs"
# Don't rebuild crate just because of changes to README or the AMI spec.
exclude = ["README.md", "amispec.toml"]

# One root volume carrying the boot, root and data partitions, so the only
# other volume on the instance is the blank workload volume at /dev/xvdb.
[package.metadata.build-variant.image-layout]
os-image-size-gib = 2
data-image-size-gib = 1
publish-image-size-hint-gib = 8
partition-plan = "unified"

[package.metadata.build-variant.image-features]
grub-set-private-var = true
xfs-data-partition = true
uefi-secure-boot = true
systemd-networkd = true
erofs-root-partition = true
external-kmod-development = false
encrypted-storage = false
in-place-updates = false

[package.metadata.build-variant]
kernel-parameters = [
    "console=tty0",
    "console=ttyS0,115200n8",
    "net.ifnames=0",
    "netdog.default-interface=eth0:dhcp4,dhcp6?",
    "quiet",
]
included-packages = [
# core
    "release",
    "kernel-6.18",
    "containerd-2.2",
    "systemd-257",
    "nftables",
    "whippet",
# tools
    "login",
    "iputils",
    "strace",
    "chrony-tools",
# image cache on the root volume, served to containerd on an empty workload volume
    "image-cache-release",
]

[lib]
path = "../variants.rs"

[build-dependencies]
image-cache-release = { path = "../../packages/image-cache-release" }
settings-defaults = { path = "../../packages/settings-defaults" }
settings-plugins = { path = "../../packages/settings-plugins" }
settings-migrations = { path = "../../packages/settings-migrations" }
